
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Website</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <link rel="stylesheet" href="style.css">
</head>

<body>


    <header>
        <nav class="navbar">

            <a href="#" class="nav-logo">
                <h2 class="logo-text">☕ Coffee</h2>
            </a>

            <ul class="nav-menu">

                <li class="nav-item">
                    <a href="#home" class="nav-link">Home</a>
                </li>

                <li class="nav-item">
                    <a href="#about" class="nav-link">About</a>
                </li>

                <li class="nav-item">
                    <a href="#menu" class="nav-link">Menu</a>
                </li>

                <li class="nav-item">
                    <a href="#testimonials" class="nav-link">Testimonials</a>
                </li>

                <li class="nav-item">
                    <a href="#gallery" class="nav-link">Gallery</a>
                </li>

                <li class="nav-item">
                    <a href="#contact" class="nav-link">Contact</a>
                </li>

            </ul>

            <button id="menu-open-button" class="fas fa-bars"></button>
            <button id="menu-close-button" class="fas fa-times"></button>

        </nav>
    </header>

    <main>

        <section class="hero-section" id="home">

            <div class="section-content hero-content">

                <div class="hero-details">

                    <h2 class="title">Best Coffee</h2>

                    <h3 class="subtitle">
                        Make your day great with our special coffee!
                    </h3>

                    <p class="description">
                        Welcome to our coffee paradise, where every bean tells
                        a story and every cup sparks joy.
                    </p>

                    <div class="buttons">
                        <a href="#menu" class="button order-now">
                            Order Now
                        </a>

                        <a href="#contact" class="button contact-us">
                            Contact Us
                        </a>
                    </div>

                </div>

                <div class="hero-image-wrapper">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnHoF_YlXd3j-QR8dHzoxUt5cbswW3f_0DBy3a07iRNA&s=10"
                        alt="Coffee cup"
                        class="hero-image"
                    >
                </div>
                        </div>

        </section>

</body>
</html>
